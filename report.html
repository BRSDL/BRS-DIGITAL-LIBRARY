<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report Safety Incident — BRS Digital Library</title><style>body{font-family:system-ui;max-width:720px;margin:40px auto;padding:0 20px;line-height:1.6}input,textarea,select,button{width:100%;padding:12px;margin:7px 0;border:1px solid #ccd3cc;border-radius:8px}button{background:#315c4c;color:white;font-weight:700}</style></head><body><h1>Report a Safety Incident</h1><p>Use this form for recording, harassment, sexual content, impersonation, privacy, child-safety, copyright or other serious concerns.</p><form id="f"><select id="c"><option value="recording">Recording / screenshot</option><option value="harassment">Harassment / bullying</option><option value="sexual_content">Sexual content / grooming</option><option value="impersonation">Impersonation / deepfake</option><option value="privacy">Privacy / personal information</option><option value="child_safety">Child safety</option><option value="copyright">Copyright</option><option value="other">Other</option></select><textarea id="d" rows="8" placeholder="Describe what happened. Do not include passwords or unnecessary sensitive information."></textarea><button>Submit report</button></form><p id="m"></p><script>f.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({category:c.value,details:d.value})});let j=await r.json();m.textContent=j.message||j.error||'Submitted';}</script></body></html>
